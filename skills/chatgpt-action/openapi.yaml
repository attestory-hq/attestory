openapi: 3.1.0
info:
  title: Attestory Local Audit API
  version: 0.3.2
  description: >
    Local-first audit bridge for .xlsx, .pptx, .html, and .csv files. Keep the
    bridge on localhost or place it behind an independently secured HTTPS
    adapter before connecting a remote Action.
servers:
  - url: http://127.0.0.1:8765
    description: Default local Attestory bridge.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check bridge availability and Attestory version
      responses:
        "200":
          description: Bridge is ready
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    const: ok
                  version:
                    type: string
                    const: 0.3.2
  /v1/context:
    get:
      operationId: getContext
      summary: Read workspace rules and recent audit history
      responses:
        "200":
          description: Current governance context
          content:
            application/json:
              schema:
                type: object
                required: [rules_yaml, recent_changelog]
                properties:
                  rules_yaml:
                    type: string
                  recent_changelog:
                    type: string
        "404":
          description: No initialized Attestory workspace
  /v1/excel/edit-verify:
    post:
      operationId: editAndVerifyExcel
      summary: Compare an original XLSX with its edited candidate
      description: >
        Prototype two-file handoff. Before calling, disclose that both XLSX
        files will be sent to the configured Attestory backend, then obtain
        explicit user consent. Only report PASS as verified. Always surface
        cell_findings and incomplete_findings; INCOMPLETE is not a pass.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - original_file
                - candidate_file
                - confirm_backend_processing
              properties:
                original_file:
                  type: string
                  format: binary
                  description: Original workbook supplied by the user.
                candidate_file:
                  type: string
                  format: binary
                  description: Exact edited candidate workbook to audit and return.
                confirm_backend_processing:
                  type: boolean
                  description: >
                    Set true only after the user has explicitly consented to
                    sending both workbooks to this configured backend.
      responses:
        "200":
          description: Audit outcome and short-lived exact-candidate/receipt links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelEditVerification"
        "400":
          description: Missing consent or unsupported file extension
        "413":
          description: Either workbook exceeds the 25 MiB upload limit
  /v1/excel/edit-verify/{audit_id}/candidate:
    get:
      operationId: downloadExcelCandidate
      summary: Download the exact candidate bytes that were audited
      parameters:
        - in: path
          name: audit_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Candidate XLSX; download link expires after 15 minutes
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "404":
          description: Download link has expired
  /v1/excel/edit-verify/{audit_id}/receipt:
    get:
      operationId: downloadExcelReceipt
      summary: Download the HTML receipt for the edit-and-verify audit
      parameters:
        - in: path
          name: audit_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HTML receipt; download link expires after 15 minutes
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Download link has expired
  /v1/commit:
    post:
      operationId: commitFile
      summary: Audit and snapshot a supported local file or upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_path]
              properties:
                file_path:
                  type: string
                  description: Path inside the configured workspace.
                message:
                  type: string
                  description: Optional audit commit note.
          multipart/form-data:
            schema:
              type: object
              properties:
                file_path:
                  type: string
                  description: Existing workspace path, alternatively provide a file.
                file:
                  type: string
                  format: binary
                message:
                  type: string
      responses:
        "200":
          description: Structured commit receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "400":
          description: Unsupported file or invalid request
        "404":
          description: Workspace file or history not found
  /v1/diff/{filename}:
    get:
      operationId: diffFile
      summary: Compare the two latest snapshots of a tracked file
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
          description: Tracked filename including its extension.
      responses:
        "200":
          description: Latest semantic snapshot diff
          content:
            application/json:
              schema:
                type: object
                required: [file, from_version, to_version, total_changes]
                properties:
                  file:
                    type: string
                  from_version:
                    type: integer
                  to_version:
                    type: integer
                  total_changes:
                    type: integer
                  changes:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                additionalProperties: true
        "404":
          description: File has fewer than two commits
  /v1/report/{filename}:
    post:
      operationId: createReport
      summary: Generate the standalone HTML audit receipt for the latest snapshot
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
          description: Tracked filename including its extension.
      responses:
        "200":
          description: Receipt HTML generated locally
          content:
            application/json:
              schema:
                type: object
                required: [path, status, summary]
                properties:
                  path:
                    type: string
                    description: Workspace-relative path to the generated HTML report.
                  status:
                    type: string
                    enum: [VERIFIED, NEEDS REVIEW]
                  summary:
                    type: object
                    additionalProperties: true
        "404":
          description: File has no committed snapshot
components:
  schemas:
    ExcelEditVerification:
      type: object
      required:
        - audit_id
        - filename
        - status
        - verified
        - original_sha256
        - candidate_sha256
        - baseline_sha256
        - findings
        - cell_findings
        - incomplete_findings
        - required_checks
        - candidate_download_url
        - receipt_download_url
        - downloads_expire_in_seconds
      properties:
        audit_id:
          type: string
        filename:
          type: string
        status:
          type: string
          enum: [PASS, FAIL, INCOMPLETE]
        verified:
          type: boolean
          description: True only when the complete audit passed.
        original_sha256:
          type: [string, "null"]
        candidate_sha256:
          type: string
        baseline_sha256:
          type: [string, "null"]
        findings:
          type: array
          items:
            type: object
            additionalProperties: true
        cell_findings:
          type: array
          items:
            type: object
            additionalProperties: true
        incomplete_findings:
          type: array
          items:
            type: object
            additionalProperties: true
        required_checks:
          type: array
          items:
            type: object
            additionalProperties: true
        candidate_download_url:
          type: string
          format: uri
        receipt_download_url:
          type: string
          format: uri
        downloads_expire_in_seconds:
          type: integer
    Receipt:
      type: object
      required:
        - file
        - version
        - sha256
        - diff_summary
        - hardcode_overrides
        - rule_violations
      properties:
        file:
          type: string
        version:
          type: integer
        sha256:
          type: string
        diff_summary:
          type: object
          additionalProperties: true
        hardcode_overrides:
          type: array
          items:
            type: object
            additionalProperties: true
        rule_violations:
          type: array
          items:
            type: object
            additionalProperties: true
