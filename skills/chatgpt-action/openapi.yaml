openapi: 3.1.0
info:
  title: Attestory Local Audit API
  version: 0.3.2
  description: >
    Local-first audit bridge for .xlsx, .pptx, .html, and .csv files. Keep the
    bridge on localhost or place it behind an independently secured HTTPS
    adapter before connecting a remote Action.
servers:
  - url: http://127.0.0.1:8765
    description: Default local Attestory bridge.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check bridge availability and Attestory version
      responses:
        "200":
          description: Bridge is ready
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    const: ok
                  version:
                    type: string
                    const: 0.3.2
  /v1/context:
    get:
      operationId: getContext
      summary: Read workspace rules and recent audit history
      responses:
        "200":
          description: Current governance context
          content:
            application/json:
              schema:
                type: object
                required: [rules_yaml, recent_changelog]
                properties:
                  rules_yaml:
                    type: string
                  recent_changelog:
                    type: string
        "404":
          description: No initialized Attestory workspace
  /v1/commit:
    post:
      operationId: commitFile
      summary: Audit and snapshot a supported local file or upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_path]
              properties:
                file_path:
                  type: string
                  description: Path inside the configured workspace.
                message:
                  type: string
                  description: Optional audit commit note.
          multipart/form-data:
            schema:
              type: object
              properties:
                file_path:
                  type: string
                  description: Existing workspace path, alternatively provide a file.
                file:
                  type: string
                  format: binary
                message:
                  type: string
      responses:
        "200":
          description: Structured commit receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        "400":
          description: Unsupported file or invalid request
        "404":
          description: Workspace file or history not found
  /v1/diff/{filename}:
    get:
      operationId: diffFile
      summary: Compare the two latest snapshots of a tracked file
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
          description: Tracked filename including its extension.
      responses:
        "200":
          description: Latest semantic snapshot diff
          content:
            application/json:
              schema:
                type: object
                required: [file, from_version, to_version, total_changes]
                properties:
                  file:
                    type: string
                  from_version:
                    type: integer
                  to_version:
                    type: integer
                  total_changes:
                    type: integer
                  changes:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                additionalProperties: true
        "404":
          description: File has fewer than two commits
  /v1/report/{filename}:
    post:
      operationId: createReport
      summary: Generate the standalone HTML audit receipt for the latest snapshot
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
          description: Tracked filename including its extension.
      responses:
        "200":
          description: Receipt HTML generated locally
          content:
            application/json:
              schema:
                type: object
                required: [path, status, summary]
                properties:
                  path:
                    type: string
                    description: Workspace-relative path to the generated HTML report.
                  status:
                    type: string
                    enum: [VERIFIED, NEEDS REVIEW]
                  summary:
                    type: object
                    additionalProperties: true
        "404":
          description: File has no committed snapshot
components:
  schemas:
    Receipt:
      type: object
      required:
        - file
        - version
        - sha256
        - diff_summary
        - hardcode_overrides
        - rule_violations
      properties:
        file:
          type: string
        version:
          type: integer
        sha256:
          type: string
        diff_summary:
          type: object
          additionalProperties: true
        hardcode_overrides:
          type: array
          items:
            type: object
            additionalProperties: true
        rule_violations:
          type: array
          items:
            type: object
            additionalProperties: true
