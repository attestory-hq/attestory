[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attestory"
version = "0.3.2"
description = "Local version control, deterministic math auditing, and semantic diffs for AI-generated spreadsheets and reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Attestory" }]
keywords = ["excel", "audit", "diff", "duckdb", "parquet", "analytics", "claude", "ai"]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "openpyxl>=3.1.2",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "pyyaml>=6.0.1",
    "python-pptx>=1.0.2",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.scripts]
attestory = "attestory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/attestory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
ignore = ["B008"]
